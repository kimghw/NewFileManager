# 양식 지침 — 연차보고서. 본문 · 표 · 서브 테이블의 작성 지침 + 작성 예시 + 주요 항목(spec/spec_양식작성.md ② §5-8).
# 문서에 이미 있는 작성요령은 적지 않는다(작업마다 문서에서 읽는다). 저장은 앱(「양식 지침」 열)이나 이 파일을 고쳐서 — 앱이 저장하면 주석은 이 머리만 남는다.
# sections[].path = 헤딩 경로(제목 글 — 「N단계 · N차년도 · 기관N」 의 숫자와 「[… : 값]」 의 값은 견주지 않는다) · tables[].head = 머리글(음영 칸 글을 「 | 」 로) ·
# subtables[].head = 서브 테이블(띠)의 머리 칸 글 · fields[].label = 칸의 라벨 글 · keywords[].output = 프로젝트 구성 값의 필드(stages · orgs · period · current · subs | 빈 글 = 문서 항목).
