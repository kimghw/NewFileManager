<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>워크플로우 — HWPX·DOCX 웹 편집</title>
  <link rel="stylesheet" href="/static/style.css"><!-- 색·글꼴·단추의 변수(앱과 같은 것) -->
  <link rel="stylesheet" href="/static/panel_help.css"><!-- 노트 도움말(아이콘 · 풍선 — design.md §1-6) — 절의 설명 글은 머리의 아이콘으로 -->
  <link rel="stylesheet" href="/static/workflow.css"><!-- TASK 워크플로우 페이지(spec_워크플로우 ② §3) — style.css 다음 -->
  <link rel="stylesheet" href="/static/workflow_agents.css"><!-- 조립 화면의 「에이전트」 열(② §18-16) — workflow.css 다음(세 칸 · 접힌 띠의 규칙이 설명 열의 규칙 뒤에 온다) -->
  <link rel="stylesheet" href="/static/workflow_names.css"><!-- 「도구 설명」 열의 「이름 바꾸기」(② §18-19) — workflow.css 다음 -->
  <link rel="stylesheet" href="/static/workflow_reqs.css"><!-- 「요구사항」 열 · 우클릭 메뉴 · 아이콘(② §18-20) — workflow.css 다음 -->
</head>
<!-- TASK 워크플로우(spec_워크플로우 — app/workflow.py 등록부 · GET /api/workflow): TASK 마다 어떤 차례로 무엇을 하는지 보는 따로 선 페이지. 읽기만 한다(실행·진행 상태 없음).
     주소는 /workflow(app/workflow_api.py 가 아래 파일 주소에 ?v= 를 붙인다). #<job> · #common-<id> 로 그 절이 바로 열린다 -->
<body class="wf wf-diagram-mode">
  <header class="topbar wf-top">
    <a class="brand" href="/" draggable="false" aria-label="HWPX·DOCX 웹 편집 — 시작 화면으로" title="시작 화면으로">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#60a5fa" d="M8 2h10a3 3 0 0 1 3 3v9.5a3 3 0 0 1-3 3h-1V7a3 3 0 0 0-3-3H8V2Z"/><path fill="#1d4ed8" fill-rule="evenodd" d="M5 5h10a3 3 0 0 1 3 3v4.2l-4.6 4.6a1.8 1.8 0 0 0-.4.7l-.6 2.4a.5.5 0 0 0 .6.6l2.4-.6c.3-.1.5-.2.7-.4l1.9-1.9V19a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Zm1.5 3.2a.8.8 0 0 0 0 1.6h7a.8.8 0 0 0 0-1.6h-7Zm0 3.5a.8.8 0 0 0 0 1.6h7a.8.8 0 0 0 0-1.6h-7Zm0 3.5a.8.8 0 0 0 0 1.6h4a.8.8 0 0 0 0-1.6h-4Z"/><path fill="#60a5fa" d="m19.3 11.5 1.7 1.7a1 1 0 0 1 0 1.4l-4.8 4.8-2.3.6.6-2.3 4.8-4.8a1 1 0 0 1 1.4 0Z"/></svg>
      <span>HWPX·DOCX 웹 편집</span>
    </a>
    <h1 class="wf-title">워크플로우</h1>
    <div class="spacer"></div>
    <div class="wf-view" role="group" aria-label="워크플로우 보기">
      <button id="wfViewDiagram" type="button" aria-pressed="true">다이어그램</button>
      <button id="wfViewList" type="button" aria-pressed="false">목록</button>
    </div>
    <button class="btn sm" id="wfOpenAll" type="button" hidden title="모든 단계의 세부(에이전트 · 코드 · 사양 자리)를 폅니다">모두 펼치기</button>
    <button class="btn sm" id="wfCloseAll" type="button" hidden>모두 접기</button>
  </header>
  <div class="wf-wrap">
    <nav class="wf-nav" id="wfNav" aria-label="목차"></nav>
    <main class="wf-main" id="wfMain" tabindex="-1">
      <p class="wf-load" id="wfLoad" role="status">워크플로우를 읽는 중…</p>
    </main>
  </div>
  <script src="/static/account/chip.js"></script><!-- 계정(상단 바 끝의 계정 단추 · 로그인이 풀린 화면을 /login 으로 — spec_계정 ② §4) — 다른 스크립트보다 먼저 -->
  <script src="/static/task_catalog.js"></script><!-- TASK 이름·한 줄 설명(TASK_CATALOG) · 이관·취합의 단계 이름(TASK_STAGE_META) — 원본 -->
  <script src="/api/tasks.js?v=2"></script><!-- v=2 = 줄 목록으로 조립한 정의(v2)도 싣는다(판 없이 읽는 옛 탭에는 표준 정의만 — spec_워크플로우 ② §18-12 ⑤). 화면에서 조립한 TASK 를 TASK 목록에 더한다(taskCatalogCustom — task_catalog.js 다음 · app.js 앞: spec_워크플로우 ② §14). 저장소 = 서버(app/custom_tasks.py) · 캐시 안 함 -->
  <script src="/static/panel_help.js"></script><!-- hHelp(노트 도움말) — workflow.js 앞 -->
  <script src="/static/workflow_agents.js"></script><!-- 조립 화면의 「에이전트」 열(WfAgents — 줄이 쓰는 에이전트의 스킬 · 도구 · 프롬프트 · 덧붙이는 글: spec_워크플로우 ② §18-16) — workflow.js 앞(혼자 선다) -->
  <script src="/static/line_tidy_rules.js"></script><!-- 줄 정리의 「규칙」(LineTidyRules — 「도구 설명」 열: spec_줄정리 ② §6) — workflow.js 앞(혼자 선다) -->
  <script src="/static/workflow_names.js"></script><!-- 도구 이름 고치기(WfNames — 「도구 설명」 열의 「이름 바꾸기」: spec_워크플로우 ② §18-19) — workflow.js 앞(혼자 선다) -->
  <script src="/static/workflow_reqs.js"></script><!-- 「요구사항」(WfReqs — 도구 · 단계 · 워크플로우마다 사용자가 말한 요구사항: 오른쪽 단추 · 아이콘 → 오른쪽 열 · spec_워크플로우 ② §18-20) — workflow.js 앞(혼자 선다) -->
  <script src="/static/workflow.js"></script>
</body>
</html>
