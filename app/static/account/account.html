<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계정 — HWPX·DOCX 웹 편집</title>
  <link rel="stylesheet" href="/static/style.css"><!-- 색·글꼴·단추의 변수(앱과 같은 것) -->
  <link rel="stylesheet" href="/static/account/account.css"><!-- 계정 페이지(spec_계정 ② §4) -->
</head>
<body class="acct">
  <header class="acct-top">
    <a class="brand" href="/" title="시작 화면으로">HWPX·DOCX 웹 편집</a>
    <span>· 계정</span>
    <div class="spacer"></div>
    <button class="btn sm" id="logout" type="button">로그아웃</button>
  </header>
  <main class="acct-card wide">
    <h2>내 계정 <small id="who"></small></h2>
    <form class="acct-form narrow" id="pwForm">
      <label>지금 비밀번호<input id="old" type="password" autocomplete="current-password" maxlength="200" required></label>
      <label>새 비밀번호<input id="new" type="password" autocomplete="new-password" maxlength="200" required></label>
      <button class="btn" type="submit">비밀번호 바꾸기</button>
      <p class="acct-msg" id="pwMsg" role="status"></p>
    </form>
  </main>
  <section class="acct-card wide" id="admin" hidden>
    <h2>승인 대기 <small id="pendN"></small></h2>
    <div id="pending"></div>
    <h2>계정 <small id="allN"></small></h2>
    <div id="all"></div>
    <p class="acct-msg" id="adMsg" role="status"></p>
  </section>
  <script src="/static/account/account_page.js"></script>
</body>
</html>
