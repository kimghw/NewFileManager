<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지침 설정 — HWPX·DOCX 웹 편집</title>
  <link rel="stylesheet" href="/static/style.css"><!-- 색·글꼴·단추의 변수(앱과 같은 것) -->
  <link rel="stylesheet" href="/static/agents.css"><!-- 따로 선 설정 페이지의 틀(상단 줄 · 목차 · 본문 — 에이전트 설정과 같은 꼴) -->
  <link rel="stylesheet" href="/static/guides.css"><!-- 지침 설정 페이지(spec_양식작성 ② §5-10) — agents.css 다음 -->
</head>
<!-- 지침 설정(spec_양식작성 ② §5-10 — app/guides_page_api.py · GET /api/guides-page/…): LLM 이 따르는 판단 지침과 양식마다의 지침(양식 정보 · 양식 지침 · 규정 · 테마 · 프로젝트의 문서 목적)을 한곳에서 보고 고치는 따로 선 페이지.
     주소는 /guides(app/guides_page_api.py 가 아래 파일 주소에 ?v= 를 붙인다). #judgment/<글 id> · #forms/<양식 키> 로 그 화면이 바로 열린다. app.js 를 읽지 않는다 -->
<body class="ags-page gp-page">
  <header class="topbar ags-top">
    <a class="brand" href="/" draggable="false" aria-label="HWPX·DOCX 웹 편집 — 시작 화면으로" title="시작 화면으로">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#60a5fa" d="M8 2h10a3 3 0 0 1 3 3v9.5a3 3 0 0 1-3 3h-1V7a3 3 0 0 0-3-3H8V2Z"/><path fill="#1d4ed8" fill-rule="evenodd" d="M5 5h10a3 3 0 0 1 3 3v4.2l-4.6 4.6a1.8 1.8 0 0 0-.4.7l-.6 2.4a.5.5 0 0 0 .6.6l2.4-.6c.3-.1.5-.2.7-.4l1.9-1.9V19a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Zm1.5 3.2a.8.8 0 0 0 0 1.6h7a.8.8 0 0 0 0-1.6h-7Zm0 3.5a.8.8 0 0 0 0 1.6h7a.8.8 0 0 0 0-1.6h-7Zm0 3.5a.8.8 0 0 0 0 1.6h4a.8.8 0 0 0 0-1.6h-4Z"/><path fill="#60a5fa" d="m19.3 11.5 1.7 1.7a1 1 0 0 1 0 1.4l-4.8 4.8-2.3.6.6-2.3 4.8-4.8a1 1 0 0 1 1.4 0Z"/></svg>
      <span>HWPX·DOCX 웹 편집</span>
    </a>
    <h1 class="ags-title">지침 설정</h1>
    <div class="gp-tabs" role="tablist" aria-label="보기">
      <button type="button" class="gp-tab" id="gpTabJudgment" role="tab" data-tab="judgment">판단 지침</button>
      <button type="button" class="gp-tab" id="gpTabForms" role="tab" data-tab="forms">양식별</button>
    </div>
    <span class="ags-count" id="gpNote"></span>
    <div class="spacer"></div>
    <a class="btn sm ags-wf" href="/agents" title="에이전트 설정 — LLM 에 맡기는 일마다 작업 번호 · 역할 · 모델 · 프롬프트">에이전트 설정</a>
    <a class="btn sm ags-wf" href="/workflow" title="워크플로우 — 워크플로우마다 어떤 차례로 무엇을 하는지, 어느 단계에서 어느 에이전트가 도는지 봅니다">워크플로우</a>
  </header>
  <div class="ags-wrap">
    <nav class="ags-nav" id="gpNav" aria-label="지침 목차"></nav>
    <main class="ags-main" id="gpMain" tabindex="-1">
      <p class="ags-note" role="status">지침을 읽는 중…</p>
    </main>
  </div>
  <div class="toast" id="gpToast" role="status" aria-live="polite" hidden></div>
  <script src="/static/account/chip.js"></script><!-- 계정(상단 바 끝의 계정 단추 · 로그인이 풀린 화면을 /login 으로 — spec_계정 ② §4) — 다른 스크립트보다 먼저 -->
  <script src="/static/guides.js"></script>
</body>
</html>
