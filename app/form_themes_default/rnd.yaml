# 테마 「연구개발과제」 — 구분 기준 타입(중요하게 볼 항목) · 기본 개요 템플릿 · 자주 쓰는 템플릿 · 이 테마의 테이블 타입
# (spec/spec_양식작성.md ② §5-7). 꼴과 고치는 법은 common.yaml 머리의 설명과 같다.
id: rnd
name: 연구개발과제
docs: [사업계획서, 연구개발계획서, 연차보고서, 단계보고서, 최종보고서]
signs: >-
  연구개발과제의 계획서 · 보고서다. 「연구개발과제」 · 「주관연구개발기관」 · 「공동연구개발기관」 · 「N단계」 · 「N차년도」 ·
  「연구개발비」 같은 말이 제목과 표 머리에 나온다.
division:
  - id: org
    name: 참여기관
    how: >-
      주관연구개발기관 · 공동연구개발기관(수요기업 포함)마다 내용과 예산이 갈린다.
      기관 이름이 붙은 절 · 표 행 · 표 열에는 그 기관의 내용만 쓴다.
      어느 기관의 몫인지 정해지지 않은 자리는 쓰기 전에 확인한다.
  - id: year
    name: 연차
    how: >-
      차년도(N차년도 · 해당연도 · 다음 연도)마다 목표 · 내용 · 실적 · 예산이 갈린다.
      자리가 가리키는 차년도의 내용만 쓴다. 실적(해당연도)과 계획(다음 연도)을 섞지 않는다.
  - id: goal
    name: 연구목표
    how: >-
      최종목표 · 단계 목표 · 차년도 목표와 그 평가 지표(성과지표 · 목표치)가 문서 전체의 기준이다.
      내용 · 실적 · 계획은 그 목표에 맞춰 쓴다. 목표의 표현과 수치는 자료 그대로 둔다.
  - id: budget
    name: 예산
    how: >-
      연구개발비(정부지원 · 기관부담 · 현금 · 현물 · 비목)는 기관 · 차년도마다 갈리는 값이다.
      금액은 그 기관 · 차년도의 자료에서 찾는다. 표에 단위가 적혀 있으면 그 단위로 쓴다.
      자료의 단위와 다르면 환산 관계를 확인할 수 있을 때만 환산한다. 합계 · 비율은 근거 없이 짐작해 쓰지 않는다.
  - id: stage
    name: 단계
    how: >-
      단계(N단계)가 차년도를 묶는다(보통 단계 > 차년도 > 기관). 단계 목표와 차년도 목표를 가려 쓴다.
templates:
  - id: main
    name: 연구개발계획서 기본
    levels: ["1.", "1-1.", "□", "o", "-", "⋅"]
    how: >-
      문서 전체 개요의 주 사슬(6레벨)이다. 번호형(1. · 1-1.)에서 기호형(□ · o · - · ⋅)으로 바뀌어도 같은 템플릿이다.
      양식이 준 번호 제목은 그대로 두고 그 아래에 기호 레벨로 쓴다.
  - id: numbered
    name: 연구개발계획서 — 괄호 번호가 낀 사슬
    levels: ["1.", "1-1.", "(1)", "o", "-", "⋅"]
    how: >-
      「1-1.」 아래에 「(1)」 이 한 레벨 더 있는 주 사슬이다.
      레벨을 건너뛴 줄(「1-1.」 바로 아래 「o」)도 같은 템플릿의 그 레벨이다.
  - id: sub
    name: 서브 템플릿 — 번호 괄호 아래
    levels: ["[1]", "□", "△"]
    how: >-
      주 사슬의 줄 아래에 붙는 다른 사슬이다. 구분 기준 값(기관 · 차년도)마다 같은 꼴로 되풀이된다.
      레벨은 그 뿌리부터 1로 센다.
  - id: label
    name: 구분 라벨 아래
    levels: ["[기관]", "o", "-"]
    how: >-
      구분 기준 값이 든 괄호 줄(「[주관연구개발기관]」 · 「[2차년도 목표]」)이 뿌리이고, 그 아래 내용이 「o › -」 로 이어진다.
      그 라벨이 가리키는 기관 · 차년도의 내용만 아래에 쓴다. 라벨 줄은 바꾸지 않는다.
tables:
  - id: by_division
    name: 구분 기준 테이블
    signs: >-
      행이나 열 머리가 구분 기준 값으로 되풀이된다 —
      「1단계-1차년도 … N단계-N차년도」 행, 기관마다 열 하나, 기관 이름 행.
    how: >-
      행 · 열 머리의 기관 · 차년도 · 단계에 맞는 내용과 값만 그 줄에 넣는다. 값 칸은 값 테이블과 같은 방법으로 쓴다.
      양식에 없는 줄을 지어 넣지 않는다. 자료에 없는 기관 · 차년도의 줄은 비워 둔다.
