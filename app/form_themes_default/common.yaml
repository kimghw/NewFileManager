# 테마 「공통」 — 모든 문서에 쓰는 테이블 타입과 자주 쓰는 개요 템플릿 (spec/spec_양식작성.md ② §5-7).
# 양식 작성 04 「LLM 검증·보완」 이 이 글을 자료로 받아 표마다 테이블 타입을, 문서가 쓰는 개요 템플릿을 밝힌다.
# 이 파일은 기본본이다 — 화면(04 「판단 지침 보기」 → 「YAML 고치기」)에서 고치면 이 PC 의 사본에 저장되고 사본이 먼저다.
# 항목마다 id(영문 소문자 · 숫자 · _ — 테마 안에서 겹치지 않게) · name(화면 이름) · signs(판별 단서) · how(작성 방법).
# 템플릿은 levels(레벨마다 레터 — 위에서 아래로). LLM 이 새로 정의한 항목은 사본의 added 에 더해진다.
id: common
name: 공통
docs: []
signs: 문서의 종류와 무관하게 모든 양식에 쓴다.
division: []
templates:
  - id: bullets
    name: 개조식 기호
    levels: ["□", "o", "-", "⋅"]
    how: >-
      번호 없이 기호로만 내려가는 사슬. 윗 줄의 내용을 아래 기호 줄이 풀어 쓴다.
      닮은 글자(o · ㅇ · ○ / - · – / ⋅ · · · •)는 같은 레터다 — 양식에 놓인 글자를 그대로 쓴다.
  - id: numbered
    name: 번호 꼴 — 숫자와 가나다
    levels: ["1.", "가.", "1)", "가)"]
    how: >-
      숫자와 가나다를 번갈아 내려가는 번호 사슬. 양식이 이 차례의 윗 레벨만 적어 두었으면 아래 레벨은 이 차례를 이어 쓴다.
      레벨을 건너뛰지 않는다.
tables:
  - id: body
    name: 본문 테이블
    signs: >-
      이름 칸(「연구개발 목표」 · 「추진 전략」) 옆이나 머리 칸 아래에 넓은 빈 칸이 있고, 그 칸에 글머리만 있는 줄 ·
      「○○ 작성」 같은 자리표시 · 안내 문장이 들었다. 한 행이 이름 칸 하나와 내용 칸 하나인 「항목 | 내용」 꼴이 많다.
      본문을 쓰는 1칸 상자도 이 타입이다.
    how: >-
      본문 내용을 표 칸에 적는다. 그 칸을 글 자리로 보고 담을 내용 · 서술 순서 · 글머리 단계 · 문체(개조식 · 문장) · 분량을 정한다.
      칸에 놓인 글머리 줄은 그대로 두고 그 뒤에 쓴다. 서술 칸이 여럿이면 칸마다(행 · 열 머리 글로 가려) 쓴다.
      이름 칸과 머리 칸의 글은 바꾸지 않는다.
  - id: heading
    name: 헤딩 테이블
    signs: >-
      개요의 제목 줄(「□ 연구개발 목표」 · 「▸ 국내 기술 동향 및 수준」)이 표 칸 안에 있다 — 짧은 제목 한 줄만 든 1칸 상자가
      바로 아래 헤딩 줄들을 이끌거나(1칸 제목 상자), 여러 칸 표의 칸 안에 제목 줄과 그 아래 글머리 줄이 함께 있다.
    how: >-
      개요 헤딩 레벨 가운데 일부를 표 안에 둔다. 표 안의 제목 줄은 헤딩이다 — 글을 바꾸지 않고, 그 제목의 내용은 그 줄 아래 레벨의 줄에 쓴다
      (1칸 제목 상자면 상자 바로 아래 본문의 줄, 칸 안이면 같은 칸의 아래 줄). 칸 안의 줄은 그 칸에서 따로 레벨을 센다(칸마다 레벨 1부터).
  - id: figure
    name: 그림 테이블
    signs: >-
      칸에 그림이 들었거나 그림을 넣을 빈 칸이 있고, 그 아래 행이나 같은 칸에 캡션 줄(「그림 N」 · 「< 제목 >」)이 있다.
      그림 칸이 나란히 여럿이고 칸마다 캡션이 붙기도 한다. 값이나 문장을 쓰는 칸은 거의 없다.
    how: >-
      그림을 표 칸 안에 넣고 캡션은 그 아래 행이나 같은 칸의 그림 아래에 쓴다 — 양식이 둔 자리를 따른다.
      캡션은 양식의 캡션 꼴(번호 · 괄호 · 정렬)을 지키고 그림마다 하나씩 쓴다.
      그림은 글로 풀어 쓰지 않는다 — 넣을 그림이 자료에 있으면 그 캡션을 남겨 사람이 넣게 한다.
  - id: value
    name: 값 테이블
    signs: >-
      위쪽 머리 행 · 왼쪽 머리 열 아래의 칸이 금액 · 건수 · 비율 · 날짜 · 이름 같은 값이거나 빈 칸 · 값 자리표시
      (「0,000」 · 「YYYY.MM」 · 「00%」)다. 단위(「(천원)」)나 합계 · 소계 줄이 있다.
    how: >-
      행 · 열 머리가 가리키는 칸에 값만 넣는다. 한 행이 나타내는 대상과 열마다의 값 · 단위를 지키고, 자료에 값이 없는 칸은 비워 둔다.
      합계 · 소계 · 비율 같은 계산 칸은 짐작해 쓰지 않는다. 머리 칸은 바꾸지 않는다.
